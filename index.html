
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>زلال اندیشه | دروس ارائه‌شده</title>

    <link rel="stylesheet" href="style/login/style.css">

</head>

<body>

    <!-- سربرگ -->

    <header class="header">

        <img
            class="leader-img"
            src="photo/leader.png"
            alt="تصویر رهبری"
        >

        <h1>زلال اندیشه دانشگاه قم</h1>

        <div class="header-logos">
            <img
                src="photo/nahad-logo.png"
                alt="لوگوی نهاد"
            >

            <img
                src="photo/zolal-logo.png"
                alt="لوگوی زلال اندیشه"
            >
        </div>

    </header>

    <!-- محتوای اصلی -->

    <main class="container">

        <section class="card">

            <div class="card-header">
                <div>
                    <h2>ترم‌ها و دروس ارائه‌شده</h2>
                    <p>برای ورود به صفحه هر ترم، روی سطر آن کلیک کنید.</p>
                </div>

                <span class="count" id="term-count">۰ ترم</span>
            </div>

            <!-- اسکرول افقی فقط در این بخش -->

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th scope="col">ترم تحصیلی</th>
                            <th scope="col">سال</th>
                            <th scope="col">دروس ارائه‌شده</th>
                        </tr>
                    </thead>

                    <tbody id="users-body"></tbody>
                </table>

            </div>

        </section>

    </main>

    <script>
        /*
         * اطلاعات هر ترم را از اینجا تغییر بده.
         * لینک هر ترم در ویژگی link قرار می‌گیرد.
         */

        const array = [
            {
                term: "ترم زمستان",
                year: "1404",
                courses: [
                    "طرح کلی اندیشه اسلامی",
                    "جریان‌شناسی سیاسی معاصر ایران"
                ],
                link: "https://example.com/winter-1404"
            },
            {
                term: "ترم پاییز",
                year: "1405",
                courses: [
                    "بررسی تطبیقی حکومت اسلامی با حکومت‌های شبه‌اسلامی و سکولار",
                    "جاهلیت مدرن و کلاسیک با رویکرد اخلاق اسلامی"
                ],
                link: "https://example.com/fall-1405"
            }
        ];

        const usersBody = document.querySelector("#users-body");
        const termCount = document.querySelector("#term-count");

        termCount.textContent =
            `${array.length.toLocaleString("fa-IR")} ترم`;

        array.forEach((item) => {
            const row = document.createElement("tr");

            // نام ترم
            const termCell = document.createElement("td");
            const termName = document.createElement("span");

            termName.className = "term-name";
            termName.textContent = item.term;
            termCell.appendChild(termName);

            // سال
            const yearCell = document.createElement("td");
            const yearBadge = document.createElement("span");

            yearBadge.className = "year-badge";
            yearBadge.textContent = item.year;
            yearCell.appendChild(yearBadge);

            // دروس
            const coursesCell = document.createElement("td");
            const coursesContainer = document.createElement("div");

            coursesContainer.className = "courses";

            item.courses.forEach((course) => {
                const courseElement = document.createElement("div");

                courseElement.className = "course-item";
                courseElement.textContent = course;

                coursesContainer.appendChild(courseElement);
            });

            coursesCell.appendChild(coursesContainer);

            // افزودن ستون‌ها به سطر
            row.append(termCell, yearCell, coursesCell);

            // کلیک روی کل سطر
            if (item.link) {
                row.classList.add("clickable-row");
                row.tabIndex = 0;
                row.setAttribute("role", "link");
                row.setAttribute(
                    "aria-label",
                    `مشاهده ${item.term} ${item.year}`
                );

                row.addEventListener("click", () => {
                    window.location.href = item.link;
                });

                row.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        window.location.href = item.link;
                    }
                });
            }

            usersBody.appendChild(row);
        });

        // پیام در صورت نبود ترم
        if (array.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 3;
            cell.className = "empty-message";
            cell.textContent = "در حال حاضر ترمی ثبت نشده است.";

            row.appendChild(cell);
            usersBody.appendChild(row);
        }
    </script>

</body>
</html>
