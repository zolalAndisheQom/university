
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>زلال اندیشه | دروس ارائه‌شده</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1769aa;
            --primary-dark: #104b80;
            --primary-light: #eaf4ff;
            --background: #f3f7fc;
            --white: #ffffff;
            --text: #24364b;
            --muted: #74859a;
            --border: #e2eaf3;
            --shadow: 0 8px 30px rgba(29, 78, 130, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: clip;
        }

        body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: clip;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.8;
        }

        img {
            max-width: 100%;
        }

        /* سربرگ آبی */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            padding: 20px 5%;
            background: linear-gradient(135deg, #104b80, #1769aa);
            color: var(--white);
            box-shadow: 0 4px 18px rgba(16, 75, 128, 0.18);
        }

        .leader-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header h1 {
            flex: 1;
            min-width: 0;
            font-size: clamp(16px, 2vw, 25px);
            font-weight: 800;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .header-logos {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-logos img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        /* محتوای اصلی */

        .container {
            width: 100%;
            max-width: 1200px;
            min-width: 0;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* کارت اصلی */

        .card {
            width: 100%;
            min-width: 0;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 25px 30px;
            background: linear-gradient(135deg, #1769aa, #104b80);
            color: var(--white);
        }

        .card-header > div {
            min-width: 0;
        }

        .card-header h2 {
            font-size: 21px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .card-header p {
            margin-top: 5px;
            font-size: 13px;
            color: #e1efff;
        }

        .count {
            flex-shrink: 0;
            white-space: nowrap;
            padding: 7px 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.14);
            color: var(--white);
            font-size: 13px;
            font-weight: 700;
        }

        /* فقط این قسمت اجازه اسکرول افقی دارد */

        .table-wrapper {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            text-align: right;
        }

        thead {
            background: #eaf4ff;
        }

        th {
            padding: 17px 22px;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        td {
            padding: 20px 22px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background: #fbfdff;
        }

        tbody tr.clickable-row {
            cursor: pointer;
        }

        tbody tr.clickable-row:hover {
            background: #eaf4ff;
        }

        tbody tr.clickable-row:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: -3px;
        }

        tbody tr.clickable-row:active {
            background: #dcecff;
        }

        .term-name {
            font-weight: 700;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .year-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 8px;
            background: #e8f7f0;
            color: #16865b;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .courses {
            display: flex;
            flex-direction: column;
            gap: 9px;
            min-width: 250px;
        }

        .course-item {
            position: relative;
            padding: 10px 30px 10px 14px;
            border: 1px solid #e2edfa;
            border-radius: 9px;
            background: #f8fbff;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .course-item::before {
            content: "";
            position: absolute;
            right: 12px;
            top: 19px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .empty-message {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        /* موبایل */

        @media (max-width: 650px) {
            .header {
                gap: 8px;
                padding: 15px 10px;
            }

            .leader-img {
                width: 38px;
                height: 38px;
            }

            .header h1 {
                font-size: 13px;
                line-height: 1.7;
            }

            .header-logos {
                gap: 4px;
            }

            .header-logos img {
                width: 30px;
                height: 30px;
            }

            .container {
                margin: 24px auto;
                padding: 0 10px;
            }

            .card {
                border-radius: 13px;
            }

            .card-header {
                padding: 18px 13px;
                gap: 8px;
            }

            .card-header h2 {
                font-size: 16px;
            }

            .card-header p {
                font-size: 11px;
                line-height: 1.8;
            }

            .count {
                padding: 5px 8px;
                font-size: 11px;
            }

            th,
            td {
                padding: 13px 12px;
                font-size: 12px;
            }

            .courses {
                min-width: 230px;
            }

            .course-item {
                padding: 8px 27px 8px 10px;
            }
        }

        @media (max-width: 360px) {
            .header {
                gap: 5px;
                padding: 12px 7px;
            }

            .leader-img {
                width: 30px;
                height: 30px;
            }

            .header h1 {
                font-size: 11px;
            }

            .header-logos img {
                width: 25px;
                height: 25px;
            }

            .card-header h2 {
                font-size: 14px;
            }

            .count {
                font-size: 10px;
                padding: 4px 6px;
            }
        }
    </style>
</head>

<body>

    <!-- سربرگ -->

    <header class="header">

        <img
            class="leader-img"
            src="photo/leader.png"
            alt="تصویر رهبری"
        >

        <h1>زلال اندیشه دانشگاه قم</h1>

        <div class="header-logos">
            <img
                src="photo/nahad-logo.png"
                alt="لوگوی نهاد"
            >

            <img
                src="photo/zolal-logo.png"
                alt="لوگوی زلال اندیشه"
            >
        </div>

    </header>

    <!-- محتوای اصلی -->

    <main class="container">

        <section class="card">

            <div class="card-header">
                <div>
                    <h2>ترم‌ها و دروس ارائه‌شده</h2>
                    <p>برای ورود به صفحه هر ترم، روی سطر آن کلیک کنید.</p>
                </div>

                <span class="count" id="term-count">۰ ترم</span>
            </div>

            <!-- اسکرول افقی فقط در این بخش -->

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th scope="col">ترم تحصیلی</th>
                            <th scope="col">سال</th>
                            <th scope="col">دروس ارائه‌شده</th>
                        </tr>
                    </thead>

                    <tbody id="users-body"></tbody>
                </table>

            </div>

        </section>

    </main>

    <script>
        /*
         * اطلاعات هر ترم را از اینجا تغییر بده.
         * لینک هر ترم در ویژگی link قرار می‌گیرد.
         */

        const array = [
            {
                term: "ترم زمستان",
                year: "1404",
                courses: [
                    "طرح کلی اندیشه اسلامی",
                    "جریان‌شناسی سیاسی معاصر ایران"
                ],
                link: "https://example.com/winter-1404"
            },
            {
                term: "ترم پاییز",
                year: "1405",
                courses: [
                    "بررسی تطبیقی حکومت اسلامی با حکومت‌های شبه‌اسلامی و سکولار",
                    "جاهلیت مدرن و کلاسیک با رویکرد اخلاق اسلامی"
                ],
                link: "https://example.com/fall-1405"
            }
        ];

        const usersBody = document.querySelector("#users-body");
        const termCount = document.querySelector("#term-count");

        termCount.textContent =
            `${array.length.toLocaleString("fa-IR")} ترم`;

        array.forEach((item) => {
            const row = document.createElement("tr");

            // نام ترم
            const termCell = document.createElement("td");
            const termName = document.createElement("span");

            termName.className = "term-name";
            termName.textContent = item.term;
            termCell.appendChild(termName);

            // سال
            const yearCell = document.createElement("td");
            const yearBadge = document.createElement("span");

            yearBadge.className = "year-badge";
            yearBadge.textContent = item.year;
            yearCell.appendChild(yearBadge);

            // دروس
            const coursesCell = document.createElement("td");
            const coursesContainer = document.createElement("div");

            coursesContainer.className = "courses";

            item.courses.forEach((course) => {
                const courseElement = document.createElement("div");

                courseElement.className = "course-item";
                courseElement.textContent = course;

                coursesContainer.appendChild(courseElement);
            });

            coursesCell.appendChild(coursesContainer);

            // افزودن ستون‌ها به سطر
            row.append(termCell, yearCell, coursesCell);

            // کلیک روی کل سطر
            if (item.link) {
                row.classList.add("clickable-row");
                row.tabIndex = 0;
                row.setAttribute("role", "link");
                row.setAttribute(
                    "aria-label",
                    `مشاهده ${item.term} ${item.year}`
                );

                row.addEventListener("click", () => {
                    window.location.href = item.link;
                });

                row.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        window.location.href = item.link;
                    }
                });
            }

            usersBody.appendChild(row);
        });

        // پیام در صورت نبود ترم
        if (array.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 3;
            cell.className = "empty-message";
            cell.textContent = "در حال حاضر ترمی ثبت نشده است.";

            row.appendChild(cell);
            usersBody.appendChild(row);
        }
    </script>

</body>
</html>
